name: Bug 报告
description: 报告可重复的软件缺陷；只可附匿名化或合成样例
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实合同、结算表、企业经营数据、个人信息或密钥；请使用匿名化/合成样例。
  - type: input
    id: version
    attributes:
      label: 价盾版本
      placeholder: v0.1.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows x64
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出最小、可重复的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误信息
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据安全确认
      options:
        - label: 我没有上传真实合同、结算资料、个人信息、账号凭证或其他敏感数据。
          required: true
