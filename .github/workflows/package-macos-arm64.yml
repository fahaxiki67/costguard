name: Package macOS arm64 (manual)

# 手动触发的 macOS Apple Silicon 打包流水线：
# Python 3.12 → lint → 全量测试 → 构建 Jiadun.app/DMG → SHA256SUMS
# → 敏感信息扫描（CI 层）→ 上传 Actions artifact。
# 不创建 Release、不推送 tag——发布动作由维护者本地另行执行并确认。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src scripts tests

      - name: Tests
        run: .venv/bin/python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Demo data determinism
        run: .venv/bin/python scripts/generate_demo_data.py --check

      - name: Build DMG (tests already run above)
        run: ./scripts/build_macos_arm64.sh --skip-checks

      - name: Sensitive-data scan (tracked files)
        run: |
          set -e
          echo "== scanning tracked paths =="
          forbidden_paths=$(git ls-files | grep -Ei '(^|/)(local_private_data|secrets|credentials)(/|$)|(^|/)\.env($|\.)|\.(pem|p12|pfx|key|mobileprovision)$' || true)
          if [ -n "$forbidden_paths" ]; then
            echo "FORBIDDEN SENSITIVE PATHS:"; echo "$forbidden_paths"; exit 1
          fi
          echo "== scanning dist artifacts for build-machine identity =="
          # 构建产物内不得包含 runner 用户名/绝对路径（app 内层审计已在构建脚本执行）
          if grep -rl "runner" dist/*.txt 2>/dev/null; then
            echo "IDENTITY-LIKE CONTENT IN SHA256SUMS"; exit 1
          fi
          echo "clean"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jiadun-macos-arm64-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
