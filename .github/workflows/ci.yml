name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src scripts tests
      - name: Tests
        run: .venv/bin/python -m pytest tests/ -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Golden regression
        run: .venv/bin/python scripts/golden_regression.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sensitive-data scan
        run: |
          # 真实工程资料/密钥不得进入仓库（AGENTS.md 第三节）
          set -e
          echo "== scanning tracked paths =="
          forbidden_paths=$(git ls-files | grep -Ei '(^|/)(local_private_data|secrets|credentials)(/|$)|(^|/)\.env($|\.)|\.(pem|p12|pfx|key|mobileprovision)$' || true)
          if [ -n "$forbidden_paths" ]; then
            echo "FORBIDDEN SENSITIVE PATHS:"; echo "$forbidden_paths"; exit 1
          fi
          non_synthetic_business_files=$(git ls-files | grep -Ei '\.(xlsx|xls|csv|docx|doc|pdf|png|jpg|jpeg)$' | grep -Ev '^(synthetic_test_data|examples)/' || true)
          if [ -n "$non_synthetic_business_files" ]; then
            echo "BUSINESS-LIKE FILES OUTSIDE SYNTHETIC/EXAMPLES:"; echo "$non_synthetic_business_files"; exit 1
          fi
          echo "== scanning tracked content =="
          secret_hits=$(git grep -IlE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|(API[_-]?KEY|SECRET|PASSWORD)[[:space:]]*[:=][[:space:]]*[^[:space:]$<{][^[:space:]]{7,}' -- . ':!.github/workflows/ci.yml' ':!.gitignore' ':!*.md' 2>/dev/null || true)
          if [ -n "$secret_hits" ]; then
            echo "CREDENTIAL-LIKE CONTENT FOUND:"; echo "$secret_hits"; exit 1
          fi
          echo "clean"
