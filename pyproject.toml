[project]
name = "jiadun"
version = "0.1.8"
description = "Jiadun（价盾）- Engineering Cost & Compliance Intelligence Workbench（工程经营合规智能工作台）"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "pyside6>=6.7,<7",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "pandas>=2.2,<3",
    "rapidfuzz>=3.9,<4",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyinstaller>=6",
]

[project.gui-scripts]
jiadun = "jiadun.app:main"
# v0.x 旧脚本的迁移兼容入口；新文档、发布物和源码统一使用 jiadun。
costguard = "jiadun.app:main"

[project.urls]
Homepage = "https://github.com/fahaxiki67/costguard"
Documentation = "https://github.com/fahaxiki67/costguard#readme"
Issues = "https://github.com/fahaxiki67/costguard/issues"
Changelog = "https://github.com/fahaxiki67/costguard/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiadun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/ 无 __init__.py，test_acceptance_runner/test_export 直接 import scripts/ 包内模块，
# 需要仓库根在 sys.path 上（CI 用 python -m pytest 隐式具备；此处让 `uv run pytest` 等效）。
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Qt 覆写方法使用 Qt 约定的驼峰命名
"src/jiadun/ui/*" = ["N802", "N803", "N806"]
"tests/*" = ["N802"]
