[project]
name = "costguard"
version = "0.1.0"
description = "CostGuard - Engineering Cost & Compliance Intelligence Workbench (工程经营合规智能工作台)"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }  # License 待定：见 docs/adr/ADR-009-license-decision.md
dependencies = [
    "pyside6>=6.7,<7",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "pandas>=2.2,<3",
    "rapidfuzz>=3.9,<4",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyinstaller>=6",
]

[project.gui-scripts]
costguard = "costguard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Qt 覆写方法使用 Qt 约定的驼峰命名
"src/costguard/ui/*" = ["N802", "N803", "N806"]
"tests/*" = ["N802"]
